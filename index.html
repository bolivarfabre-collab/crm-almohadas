<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Comercial Ethan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-bed text-indigo-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider">COMERCIAL ETHAN <span class="text-xs text-indigo-400 font-normal">CRM Cloud</span></h1>
        </div>
        <div id="status-conexion" class="text-xs px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
            <i class="fa-solid fa-spinner fa-spin mr-1"></i> Conectando a Firebase...
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full space-y-6">
        
        <!-- Tarjetas de Resumen Rápido -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-sm">Clientes Activos</p>
                <h3 id="total-clientes" class="text-2xl font-bold mt-1 text-white">7</h3>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-sm">Ventas Totales (Jul)</p>
                <h3 class="text-2xl font-bold mt-1 text-emerald-400">$480.00</h3>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-sm">Saldo Pendiente</p>
                <h3 class="text-2xl font-bold mt-1 text-rose-400">$430.00</h3>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-sm">Estado del Sistema</p>
                <h3 class="text-2xl font-bold mt-1 text-emerald-400">En Línea</h3>
            </div>
        </div>

        <!-- Sección de Clientes / Créditos -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-400"></i> Directorio de Clientes y Créditos (Julio 2026)
                </h2>
                <button onclick="cargarDatosDesdeFirebase()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm transition font-medium">
                    <i class="fa-solid fa-rotate mr-1"></i> Actualizar Datos
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase">
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Artículo / Detalle</th>
                            <th class="p-3">Vendedor</th>
                            <th class="p-3">Estado Deuda</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-clientes-body" class="divide-y divide-slate-700/50 text-sm">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-slate-400">Cargando registros desde la nube...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script de Conexión a Firebase (Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwgvrnx4iXLl4l7g6vBmMPrVUAojrBiA",
            authDomain: "crm-almohadas.firebaseapp.com",
            projectId: "crm-almohadas",
            storageBucket: "crm-almohadas.firebasestorage.app",
            messagingSenderId: "908140665373",
            appId: "1:908140665373:web:dd25aa031f843be63144f4",
            measurementId: "G-80YSWZHK35"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarDatosDesdeFirebase() {
            const badge = document.getElementById('status-conexion');
            const tbody = document.getElementById('tabla-clientes-body');
            
            badge.className = "text-xs px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30";
            badge.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Sincronizando...';

            try {
                const querySnapshot = await getDocs(collection(db, "clientes_ethan"));
                let filasHTML = "";
                let contador = 0;

                querySnapshot.forEach((doc) => {
                    contador++;
                    const data = doc.data();
                    // Determinamos vendedor según el registro histórico (Estefanía por Bolívar, resto por George por defecto)
                    let vendedor = data.nombre && data.nombre.includes("Estefanía") ? "Bolívar" : "George";
                    
                    filasHTML += `
                        <tr class="hover:bg-slate-700/30 transition">
                            <td class="p-3 font-medium text-white">${data.nombre || 'Sin nombre'}</td>
                            <td class="p-3 text-slate-300">${data.articulo || 'Almohada a crédito'}</td>
                            <td class="p-3 text-indigo-300">${vendedor}</td>
                            <td class="p-3 font-semibold text-rose-400">Pendiente</td>
                        </tr>
                    `;
                });

                if (contador === 0) {
                    filasHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No se encontraron registros en clientes_ethan.</td></tr>`;
                }

                tbody.innerHTML = filasHTML;
                document.getElementById('total-clientes').innerText = contador;

                badge.className = "text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                badge.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Conectado a la Nube';

            } catch (error) {
                console.error("Error al obtener documentos: ", error);
                badge.className = "text-xs px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30";
                badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Error de Conexión';
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-rose-400">Error al cargar datos. Verifica tu conexión.</td></tr>`;
            }
        }

        window.onload = cargarDatosDesdeFirebase;
        window.cargarDatosDesdeFirebase = cargarDatosDesdeFirebase;
    </script>
</body>
</html>
