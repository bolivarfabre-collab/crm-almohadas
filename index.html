<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Comercial Ethan - Sincronizado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <div>
                <h1 class="text-3xl font-black text-amber-400 tracking-wide">Comercial Ethan</h1>
                <p class="text-slate-400 text-sm">Sistema CRM y Control Financiero en la Nube</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center gap-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 mr-2 bg-emerald-500 rounded-full animate-pulse"></span> Firebase Sincronizado
                </span>
            </div>
        </header>

        <!-- SECCIÓN DE MÉTRICAS -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-xs font-semibold uppercase">Total Clientes</p>
                <h3 id="stat-clientes" class="text-2xl font-bold mt-1 text-white">0</h3>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-xs font-semibold uppercase">Ventas Registradas</p>
                <h3 id="stat-ventas" class="text-2xl font-bold mt-1 text-amber-400">$0.00</h3>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-xs font-semibold uppercase">Cobros / Créditos</p>
                <h3 id="stat-cobros" class="text-2xl font-bold mt-1 text-blue-400">$0.00</h3>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-xs font-semibold uppercase">Gastos Operativos</p>
                <h3 id="stat-gastos" class="text-2xl font-bold mt-1 text-rose-400">$0.00</h3>
            </div>
        </div>

        <!-- FORMULARIO RÁPIDO Y LISTADOS -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Panel de Registro -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl h-fit">
                <h2 class="text-xl font-bold mb-4 text-amber-400">Nuevo Registro</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Registro</label>
                        <select id="tipo-reg" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400">
                            <option value="cliente">Cliente / Crédito</option>
                            <option value="venta">Venta de Colchón / Artículo</option>
                            <option value="gasto">Gasto Diario (Gasolina, etc.)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Descripción / Nombre del Cliente</label>
                        <input type="text" id="input-desc" placeholder="Ej. Colchón ortopédico / Juan Pérez" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Monto ($)</label>
                        <input type="number" step="0.01" id="input-monto" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400">
                    </div>

                    <button onclick="guardarRegistro()" class="w-full bg-amber-500 hover:bg-amber-600 font-bold text-slate-950 p-3 rounded-lg transition shadow-lg">
                        Guardar en la Nube
                    </button>
                </div>
            </div>

            <!-- Listado en Tiempo Real -->
            <div class="lg:col-span-2 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-white">Actividad Reciente</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">Tipo</th>
                                <th class="p-3">Descripción</th>
                                <th class="p-3">Monto</th>
                                <th class="p-3">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-registros" class="divide-y divide-slate-700">
                            <!-- Los registros se cargan dinámicamente desde Firebase -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- CONFIGURACIÓN Y CONEXIÓN A FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addData, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Credenciales de tu proyecto de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDwgvrnx4iXL4l7g6vBmPRVUAuojrBiA",
            authDomain: "crm-almohadas.firebaseapp.com",
            projectId: "crm-almohadas",
            storageBucket: "crm-almohadas.firebasestorage.app",
            messagingSenderId: "908140665373",
            appId: "1:908140665373:web:dd25aa031f843be63144f4",
            measurementId: "G-80YSWZHK35"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función global para guardar
        window.guardarRegistro = async function() {
            const tipo = document.getElementById('tipo-reg').value;
            const desc = document.getElementById('input-desc').value;
            const monto = parseFloat(document.getElementById('input-monto').value) || 0;

            if(!desc) {
                alert("Por favor ingresa una descripción.");
                return;
            }

            try {
                await addDoc(collection(db, "registros_ethan"), {
                    tipo: tipo,
                    descripcion: desc,
                    monto: monto,
                    fecha: new Date().toISOString()
                });
                document.getElementById('input-desc').value = '';
                document.getElementById('input-monto').value = '';
            } catch (e) {
                console.error("Error al guardar: ", e);
                alert("Hubo un error al guardar el registro.");
            }
        };

        // Función global para eliminar
        window.eliminarRegistro = async function(id) {
            if(confirm("¿Seguro que deseas eliminar este registro?")) {
                try {
                    await deleteDoc(doc(db, "registros_ethan", id));
                } catch (e) {
                    console.error("Error al eliminar: ", e);
                }
            }
        };

        // Escuchar cambios en tiempo real desde Firestore
        onSnapshot(collection(db, "registros_ethan"), (snapshot) => {
            const tabla = document.getElementById('tabla-registros');
            tabla.innerHTML = '';
            
            let totalClientes = 0;
            let totalVentas = 0;
            let totalCobros = 0;
            let totalGastos = 0;

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;

                if(data.tipo === 'cliente') totalClientes++;
                if(data.tipo === 'venta') totalVentas += data.monto;
                if(data.tipo === 'cliente') totalCobros += data.monto;
                if(data.tipo === 'gasto') totalGastos += data.monto;

                let badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                if(data.tipo === 'venta') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                if(data.tipo === 'gasto') badgeColor = 'bg-rose-500/10 text-rose-400 border-rose-500/20';

                tabla.innerHTML += `
                    <tr class="hover:bg-slate-750 transition">
                        <td class="p-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${badgeColor}">
                                ${data.tipo.toUpperCase()}
                            </span>
                        </td>
                        <td class="p-3 font-medium">${data.descripcion}</td>
                        <td class="p-3 font-bold text-white">$${data.monto.toFixed(2)}</td>
                        <td class="p-3">
                            <button onclick="eliminarRegistro('${id}')" class="text-rose-400 hover:text-rose-300 text-xs font-semibold bg-rose-500/10 px-2.5 py-1 rounded border border-rose-500/20">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stat-clientes').innerText = totalClientes;
            document.getElementById('stat-ventas').innerText = `$${totalVentas.toFixed(2)}`;
            document.getElementById('stat-cobros').innerText = `$${totalCobros.toFixed(2)}`;
            document.getElementById('stat-gastos').innerText = `$${totalGastos.toFixed(2)}`;
        });
    </script>
</body>
</html>
